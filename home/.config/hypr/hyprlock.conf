
general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot

    blur_passes = 4
    blur_size = 8
    noise = 0.015
    contrast = 1.05
    brightness = 0.78
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = $TIME12
    color = rgba(E8E3D8FF)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d %B')"
    color = rgba(CFC8BDCC)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 54
    outline_thickness = 2

    dots_size = 0.22
    dots_spacing = 0.22
    dots_center = true

    outer_color = rgba(FFFFFF22)
    inner_color = rgba(11111188)
    font_color = rgba(E8E3D8FF)

    fade_on_empty = false
    hide_input = false

    check_color = rgba(95B9ABFF)
    fail_color = rgba(CA6D6DFF)
    capslock_color = rgba(D8B26EFF)

    placeholder_text = Password...
    fail_text = Authentication failed

    position = 0, -25
    halign = center
    valign = center
}

label {
    monitor =
    text =
    color = rgba(FFFFFF55)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -85
    halign = center
    valign = center
}
