
# =========================================================
# KITTY — CLASSIC BLACK CONTRAST (SCREENSHOT STYLE)
# =========================================================


# ---------------------------------------------------------
# FONT
# ---------------------------------------------------------
font_family                 JetBrainsMono Nerd Font
font_size                   12.0


# ---------------------------------------------------------
# WINDOW
# ---------------------------------------------------------
window_padding_width        14
window_margin_width         0

hide_window_decorations     yes
confirm_os_window_close     0

placement_strategy          center


# ---------------------------------------------------------
# BACKGROUND / FULLY OPAQUE
# ---------------------------------------------------------
background                  #07090C
foreground                  #F2F4F7
background_opacity          1.0
dynamic_background_opacity  no


# ---------------------------------------------------------
# TEXT
# ---------------------------------------------------------
bold_font                   auto
italic_font                 auto
bold_italic_font            auto

dim_opacity                 0.88


# ---------------------------------------------------------
# CURSOR
# ---------------------------------------------------------
cursor                      #F2F4F7
cursor_text_color           #07090C

cursor_shape                beam
cursor_blink_interval       0.6


# ---------------------------------------------------------
# SELECTION
# ---------------------------------------------------------
selection_background        #3C4652
selection_foreground        #FFFFFF


# ---------------------------------------------------------
# LINKS
# ---------------------------------------------------------
url_color                   #a9c4e5
url_style                   single


# ---------------------------------------------------------
# ANSI COLORS — DESATURATED SLATE / BLUE / TEAL
# ---------------------------------------------------------


# ---------------------------------------------------------
# KITTY INTERNAL BORDERS
# ---------------------------------------------------------
window_border_width         1
active_border_color         #8498ac
inactive_border_color       #303b46


# ---------------------------------------------------------
# TAB BAR
# ---------------------------------------------------------
tab_bar_style               hidden


# ---------------------------------------------------------
# BELL
# ---------------------------------------------------------
enable_audio_bell           no
visual_bell_duration        0


# ---------------------------------------------------------
# HISTORY
# ---------------------------------------------------------
scrollback_lines            10000


# ---------------------------------------------------------
# SHELL: use the account login shell (no forced fish dependency)
# ---------------------------------------------------------
