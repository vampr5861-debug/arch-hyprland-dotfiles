name: Installer checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Installer and wallpaper catalog
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check installer shell syntax
        run: bash -n install.sh

      - name: Validate components and wallpaper catalog
        run: python3 tools/momo_installer.py --check

      - name: Run standard-library unit tests
        run: python3 -m unittest discover -s tests -v
